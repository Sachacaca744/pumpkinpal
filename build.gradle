plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.pumpkinpal'
base { archivesName = 'pumpkinpal' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.4.161'
    runs {
        client { client() }
    }
    mods {
        pumpkinpal { sourceSet sourceSets.main }
    }
}
